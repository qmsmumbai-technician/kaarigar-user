<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kaarigar Technician</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1C2541" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', sans-serif; background: #F6F4EF; color: #20242C;
    min-height: 100vh; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 420px; min-height: 100vh; background: #F6F4EF; padding-bottom: 40px; }
  header {
    background: linear-gradient(135deg, #1C2541, #223163);
    padding: 24px 20px 18px; color: #F6F4EF;
  }
  header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; margin: 0; letter-spacing: 0.02em;
  }
  header p {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #F2A93B; margin: 4px 0 0;
  }
  main { padding: 20px; }
  h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; color: #1C2541; }
  .sub { color: #8891A0; font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #1C2541; }
  input[type="text"], input[type="tel"] {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(32,36,44,0.15);
    background: #FBFAF6; font-size: 15px; margin-bottom: 14px; font-family: 'Inter', sans-serif; color: #20242C;
  }
  .trades { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .trade-chip {
    display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: 1px solid rgba(32,36,44,0.15); background: transparent; color: #8891A0; font-size: 14px;
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .trade-chip.active { color: #fff; border-color: transparent; }
  #btn-toggle {
    width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    color: #1C2541; background: #F2A93B; cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background 0.2s, color 0.2s;
  }
  #btn-toggle.online { background: #2E8B57; color: #fff; }
  #btn-toggle:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { font-size: 12px; color: #8891A0; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }
  .status-box {
    margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 12px;
    font-family: 'JetBrains Mono', monospace; display: none; line-height: 1.6;
  }
  .status-box.show { display: block; }
  .status-box.ok { background: rgba(46,139,87,0.1); color: #205e3d; border: 1px solid rgba(46,139,87,0.3); }
  .status-box.warn { background: rgba(199,125,30,0.1); color: #8B5E1E; border: 1px solid rgba(199,125,30,0.3); }
  .status-box.err { background: rgba(200,60,60,0.1); color: #8f2b2b; border: 1px solid rgba(200,60,60,0.3); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2E8B57; margin-right: 6px; }
  footer { padding: 20px; text-align: center; }
  footer a { color: #8891A0; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>KAARIGAR</h1>
    <p>TECHNICIAN · LIVE GPS · REAL BACKEND</p>
  </header>
  <main>
    <h2>Your status</h2>
    <p class="sub">Going online shares your live location with nearby users.</p>

    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="e.g. Ramesh Yadav" />

    <label for="phone">Phone number (users will call this)</label>
    <input type="tel" id="phone" placeholder="+9198XXXXXXXX" />

    <label>Your trades</label>
    <div class="trades" id="trades">
      <button type="button" class="trade-chip" data-trade="plumbing" style="--accent:#2F6FA8">🔧 Plumber</button>
      <button type="button" class="trade-chip" data-trade="electrical" style="--accent:#C77D1E">⚡ Electrician</button>
      <button type="button" class="trade-chip" data-trade="carpentry" style="--accent:#8B5E3C">🔨 Carpenter</button>
      <button type="button" class="trade-chip" data-trade="ac_technician" style="--accent:#2E9BB0">❄️ AC Technician</button>
      <button type="button" class="trade-chip" data-trade="ro_water" style="--accent:#1E88A8">💧 RO / Water Purifier</button>
      <button type="button" class="trade-chip" data-trade="washing_machine" style="--accent:#6B5CA5">🌀 Washing Machine</button>
      <button type="button" class="trade-chip" data-trade="refrigerator" style="--accent:#2E8B57">🧊 Refrigerator</button>
      <button type="button" class="trade-chip" data-trade="tv_repair" style="--accent:#4A4A68">📺 TV Repairing</button>
      <button type="button" class="trade-chip" data-trade="home_cleaning" style="--accent:#3FA796">🧹 Home Cleaning</button>
      <button type="button" class="trade-chip" data-trade="pest_control" style="--accent:#7A8B3C">🐜 Pest Control</button>
      <button type="button" class="trade-chip" data-trade="window_sliding" style="--accent:#5C7A9E">🪟 Window Sliding</button>
      <button type="button" class="trade-chip" data-trade="fabrication" style="--accent:#7A5C3C">🛠️ Fabrication</button>
      <button type="button" class="trade-chip" data-trade="pooja_pandit" style="--accent:#B8722E">🕉️ Pooja Pandit</button>
      <button type="button" class="trade-chip" data-trade="computer_repair" style="--accent:#45577A">💻 Computer Repair</button>
      <button type="button" class="trade-chip" data-trade="painter" style="--accent:#C15A4E">🎨 Painter</button>
      <button type="button" class="trade-chip" data-trade="marriage_photography" style="--accent:#A34D77">📷 Marriage Photography</button>
    </div>

    <button id="btn-toggle">Go Online</button>
    <p class="hint" id="hint">Add your name, phone, and at least one trade first.</p>

    <div class="status-box" id="status"></div>
  </main>
  <footer>
    <a href="#" id="config-note">⚠ Firebase not configured yet — see setup notes in this file</a>
  </footer>
</div>

<script type="module">
  // ------------------------------------------------------------------
  // STEP 1: Paste your Firebase project config here.
  // Get this from: Firebase console → Project settings → Your apps → Web app (</>)
  // ------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCVp07idh5slisdnJ6MWXc439_mEp17cns",
    authDomain: "kaarigar-technician.firebaseapp.com",
    projectId: "kaarigar-technician",
    storageBucket: "kaarigar-technician.firebasestorage.app",
    messagingSenderId: "717561353020",
    appId: "1:717561353020:web:0e4cc925fb7ab3d9b74439"
  };
  const isConfigured = firebaseConfig.apiKey !== "REPLACE_ME";

  // db-related functions are filled in later IF Firebase loads successfully.
  // Everything below (buttons, inputs) is wired up immediately regardless,
  // so the screen is always interactive even if Firebase fails to load.
  let db = null;
  let fsDoc = null, fsSetDoc = null, fsServerTimestamp = null;

  // Register service worker for installability (non-blocking, safe to fail)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }

  // ------------------------------------------------------------------
  // Local state
  // ------------------------------------------------------------------
  const nameEl = document.getElementById("name");
  const phoneEl = document.getElementById("phone");
  const tradeButtons = document.querySelectorAll(".trade-chip");
  const toggleBtn = document.getElementById("btn-toggle");
  const hintEl = document.getElementById("hint");
  const statusEl = document.getElementById("status");

  const selectedTrades = new Set(["plumbing"]);
  let online = false;
  let watchId = null;
  let lastWriteAt = 0;
  const WRITE_INTERVAL_MS = 15000;

  // restore saved profile
  nameEl.value = localStorage.getItem("kaarigar_name") || "";
  phoneEl.value = localStorage.getItem("kaarigar_phone") || "";
  nameEl.addEventListener("input", () => localStorage.setItem("kaarigar_name", nameEl.value));
  phoneEl.addEventListener("input", () => localStorage.setItem("kaarigar_phone", phoneEl.value));

  function techId() {
    const digits = (phoneEl.value || "").replace(/\D/g, "");
    if (digits) return digits;
    let fallback = localStorage.getItem("kaarigar_fallback_id");
    if (!fallback) {
      fallback = "t_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("kaarigar_fallback_id", fallback);
    }
    return fallback;
  }

  function renderTrades() {
    tradeButtons.forEach((btn) => {
      const active = selectedTrades.has(btn.dataset.trade);
      btn.classList.toggle("active", active);
      btn.style.background = active ? btn.style.getPropertyValue("--accent") : "transparent";
    });
    updateToggleState();
  }
  tradeButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      if (online) return;
      const t = btn.dataset.trade;
      selectedTrades.has(t) ? selectedTrades.delete(t) : selectedTrades.add(t);
      renderTrades();
    });
  });
  renderTrades();

  function updateToggleState() {
    const ready = nameEl.value.trim() && phoneEl.value.trim() && selectedTrades.size > 0;
    toggleBtn.disabled = !ready && !online;
    hintEl.style.display = !ready && !online ? "block" : "none";
  }
  nameEl.addEventListener("input", updateToggleState);
  phoneEl.addEventListener("input", updateToggleState);

  function showStatus(kind, html) {
    statusEl.className = "status-box show " + kind;
    statusEl.innerHTML = html;
  }

  async function writeLocation(lat, lng) {
    if (!db) {
      showStatus("err", "⚠ Firebase isn't connected — location isn't being saved yet. Check firebaseConfig, and check your internet connection.");
      return;
    }
    lastWriteAt = Date.now();
    try {
      await fsSetDoc(
        fsDoc(db, "technicians", techId()),
        {
          name: nameEl.value.trim(),
          phone: phoneEl.value.trim(),
          trades: Array.from(selectedTrades),
          lat, lng,
          online: true,
          rating: 4.7,
          updatedAt: fsServerTimestamp()
        },
        { merge: true }
      );
      showStatus(
        "ok",
        `<span class="dot"></span>Live — lat ${lat.toFixed(4)}, lng ${lng.toFixed(4)}<br/>Last update: ${new Date().toLocaleTimeString()}`
      );
    } catch (e) {
      showStatus("err", "⚠ Couldn't write to Firestore: " + e.message);
    }
  }

  async function goOffline() {
    if (db) {
      try {
        await fsSetDoc(fsDoc(db, "technicians", techId()), { online: false, updatedAt: fsServerTimestamp() }, { merge: true });
      } catch {}
    }
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    showStatus("warn", "You're offline — hidden from nearby users.");
  }

  function goOnline() {
    if (!("geolocation" in navigator)) {
      showStatus("err", "This browser doesn't support GPS.");
      return;
    }
    showStatus("warn", "Requesting location permission…");
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const now = Date.now();
        if (now - lastWriteAt >= WRITE_INTERVAL_MS || lastWriteAt === 0) {
          writeLocation(pos.coords.latitude, pos.coords.longitude);
        }
      },
      (err) => {
        showStatus("err", "⚠ Location error: " + err.message + ". Make sure location is enabled and permission granted.");
      },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
  }

  toggleBtn.addEventListener("click", () => {
    online = !online;
    toggleBtn.textContent = online ? "Go Offline" : "Go Online";
    toggleBtn.classList.toggle("online", online);
    nameEl.disabled = online;
    phoneEl.disabled = online;
    tradeButtons.forEach((b) => (b.style.pointerEvents = online ? "none" : "auto"));
    if (online) goOnline(); else goOffline();
  });

  // best-effort: mark offline if the tab is closed
  window.addEventListener("beforeunload", () => {
    if (online && db && fsSetDoc && fsDoc) {
      fsSetDoc(fsDoc(db, "technicians", techId()), { online: false }, { merge: true }).catch(() => {});
    }
  });

  // ------------------------------------------------------------------
  // Load Firebase LAST, using a dynamic import wrapped in try/catch.
  // If this fails (no internet, CDN blocked, bad config), the whole
  // screen above still works — you just get a visible warning instead
  // of a silently-broken page.
  // ------------------------------------------------------------------
  const configNote = document.getElementById("config-note");
  if (!isConfigured) {
    configNote.textContent = "⚠ Firebase not configured yet — edit firebaseConfig in index.html";
  } else {
    (async () => {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const app = initializeApp(firebaseConfig);
        db = fs.getFirestore(app);
        fsDoc = fs.doc;
        fsSetDoc = fs.setDoc;
        fsServerTimestamp = fs.serverTimestamp;
        configNote.style.display = "none";
      } catch (e) {
        configNote.textContent = "⚠ Couldn't load Firebase (check internet connection): " + e.message;
        console.error("Firebase load failed:", e);
      }
    })();
  }
</script>
</body>
</html>
